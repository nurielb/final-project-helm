fluent-bit:
  kind: DaemonSet

  existingConfigMap: ""

  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 1
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On

    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          Tag kube.var.log.containers.*
          Path_Key filename
          multiline.parser docker, cri
          Mem_Buf_Limit 50MB
          Skip_Long_Lines On

    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Kube_Tag_Prefix kube.var.log.containers.
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude Off


    outputs: |
      [OUTPUT]
          Name stdout
          Match *
          Format json_lines

      [OUTPUT]
          Name loki
          Match *
          Host loki-gateway.monitoring.svc.cluster.local
          Port 80
          Labels job=fluent-bit
          Label_Keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']

    customParsers: |
      [PARSER]
          Name docker_no_time
          Format json
          Time_Keep Off
          Time_Key time
          Time_Format %Y-%m-%dT%H:%M:%S.%L